name: Build Garden Release APK
on:
  push:
    branches:
      - main
  workflow_dispatch: # 网页手动触发入口

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Restore keystore file from secret
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE }}" | base64 -d > keystore/garden_release.p12
          
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Gradle build release
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ./gradlew :app:assembleRelease 2>&1 | tee build-log.txt
          cat build-log.txt
    
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: garden-apk
          path: app/build/outputs/apk/release/*.apk
